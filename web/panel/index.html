<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SesVizyon — Ses'ten Video'ya Otomatik Sosyal Medya Yayını</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e17; --bg2:#0f1322; --panel:#131830; --panel2:#181f3d;
  --border:#232b4d; --text:#e8ecf8; --muted:#8b93b8;
  --primary:#6c5ce7; --primary2:#a29bfe; --accent:#00cec9;
  --danger:#ff7675; --warn:#fdcb6e; --ok:#55efc4;
  --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
h1,h2,h3,.brand{font-family:'Space Grotesk',sans-serif}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a3358;border-radius:9px}

/* ---------- LAYOUT ---------- */
.app{display:flex;height:100vh}
.sidebar{width:262px;flex-shrink:0;background:linear-gradient(180deg,var(--bg2),#0c1020);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:width .25s}
.sidebar.collapsed{width:76px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:66px;display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:1px solid var(--border);background:rgba(15,19,34,.7);backdrop-filter:blur(12px)}
.content{flex:1;overflow-y:auto;padding:28px;scroll-behavior:smooth}

/* ---------- SIDEBAR ---------- */
.brand{display:flex;align-items:center;gap:12px;padding:20px 18px;border-bottom:1px solid var(--border)}
.brand .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;box-shadow:0 6px 18px rgba(108,92,231,.4)}
.brand b{font-size:18px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:400;font-family:'Inter'}
.nav{flex:1;overflow-y:auto;padding:14px 10px}
.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);padding:14px 12px 6px;white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;cursor:pointer;color:var(--muted);font-weight:500;font-size:14px;margin-bottom:2px;transition:.18s;white-space:nowrap;position:relative}
.nav-item .ico{width:22px;text-align:center;font-size:17px;flex-shrink:0}
.nav-item:hover{background:rgba(108,92,231,.1);color:var(--text)}
.nav-item.active{background:linear-gradient(90deg,rgba(108,92,231,.25),rgba(0,206,201,.08));color:#fff}
.nav-item.active::before{content:'';position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--primary)}
.nav-item.locked{opacity:.45;cursor:not-allowed}
.sidebar-foot{padding:14px;border-top:1px solid var(--border)}
.user-chip{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--panel);cursor:pointer}
.user-chip .av{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#e17055,#fdcb6e);display:flex;align-items:center;justify-content:center;font-weight:700;color:#20130a;flex-shrink:0}
.user-chip small{display:block;color:var(--muted);font-size:11px}

/* ---------- TOPBAR ---------- */
.page-title{font-size:19px;font-weight:700}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:12px}
.search-box{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px 14px;width:260px}
.search-box input{background:none;border:none;outline:none;color:var(--text);width:100%;font-size:13px}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:16px;position:relative;transition:.18s}
.icon-btn:hover{color:var(--text);border-color:var(--primary)}
.badge-dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--danger)}

/* ---------- COMPONENTS ---------- */
.btn{border:none;cursor:pointer;font-family:'Inter';font-weight:600;font-size:13.5px;padding:11px 20px;border-radius:12px;transition:.18s;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:linear-gradient(135deg,var(--primary),#8e7bff);color:#fff;box-shadow:0 6px 20px rgba(108,92,231,.35)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(108,92,231,.5)}
.btn-ghost{background:var(--panel);border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--primary)}
.btn-danger{background:rgba(255,118,117,.12);color:var(--danger);border:1px solid rgba(255,118,117,.3)}
.btn-success{background:rgba(85,239,196,.12);color:var(--ok);border:1px solid rgba(85,239,196,.3)}
.btn-sm{padding:7px 13px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:22px}
.card h3{font-size:15.5px;margin-bottom:4px}
.card .sub{color:var(--muted);font-size:12.5px;margin-bottom:16px}
.grid{display:grid;gap:18px}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}

.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;position:relative;overflow:hidden}
.stat-card::after{content:'';position:absolute;top:-40px;right:-40px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(108,92,231,.18),transparent 70%)}
.stat-card .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px}
.stat-card .val{font-size:30px;font-weight:800;margin:6px 0 2px;font-family:'Space Grotesk'}
.stat-card .tr{font-size:12px}
.tr.up{color:var(--ok)}.tr.down{color:var(--danger)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:10px 12px;border-bottom:1px solid var(--border);font-weight:600}
td{padding:13px 12px;border-bottom:1px solid rgba(35,43,77,.6)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(108,92,231,.04)}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:20px}
.tag-ok{background:rgba(85,239,196,.12);color:var(--ok)}
.tag-warn{background:rgba(253,203,110,.12);color:var(--warn)}
.tag-danger{background:rgba(255,118,117,.12);color:var(--danger)}
.tag-info{background:rgba(108,92,231,.15);color:var(--primary2)}
.tag-muted{background:rgba(139,147,184,.12);color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}

input,select,textarea{background:var(--bg2);border:1px solid var(--border);border-radius:11px;color:var(--text);padding:11px 14px;font-size:13.5px;font-family:'Inter';outline:none;width:100%;transition:.18s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(108,92,231,.15)}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.field{margin-bottom:16px}
.row{display:flex;gap:14px}.row>.field{flex:1}

.switch{position:relative;width:44px;height:24px;flex-shrink:0;cursor:pointer}
.switch input{opacity:0;width:0;height:0}
.slider-t{position:absolute;inset:0;background:#2a3358;border-radius:24px;transition:.2s}
.slider-t::before{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.switch input:checked+.slider-t{background:var(--primary)}
.switch input:checked+.slider-t::before{transform:translateX(20px)}

/* ---------- PAGES ---------- */
.page{display:none;animation:fadeIn .3s}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-head{margin-bottom:24px;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px}
.page-head h2{font-size:24px}
.page-head p{color:var(--muted);font-size:13.5px;margin-top:4px}

/* upload */
.drop{border:2px dashed var(--border);border-radius:var(--radius);padding:44px 20px;text-align:center;cursor:pointer;transition:.2s}
.drop:hover,.drop.over{border-color:var(--primary);background:rgba(108,92,231,.06)}
.drop .big{font-size:42px;margin-bottom:10px}
.progress{height:8px;background:var(--bg2);border-radius:8px;overflow:hidden;margin-top:14px}
.progress>div{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:8px;transition:width .3s}

canvas.viz{width:100%;border-radius:12px;background:#000;display:block}
video{width:100%;border-radius:12px;background:#000}

.theme-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tp{height:64px;border-radius:12px;cursor:pointer;border:2px solid transparent;position:relative;overflow:hidden;transition:.15s}
.tp.sel{border-color:#fff;transform:scale(1.04)}
.tp span{position:absolute;bottom:6px;left:8px;font-size:10px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.6)}

/* social cards */
.social-card{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;padding:26px 18px}
.social-card .ic{width:60px;height:60px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff}
.sc-fb{background:linear-gradient(135deg,#1877f2,#0e5fce)}
.sc-tt{background:linear-gradient(135deg,#111,#333)}
.sc-ig{background:linear-gradient(135deg,#f58529,#dd2a7b,#8134af)}
.sc-in{background:linear-gradient(135deg,#0a66c2,#004182)}
.sc-x{background:linear-gradient(135deg,#222,#000)}

/* plans */
.plan-card{position:relative;display:flex;flex-direction:column;gap:0;overflow:hidden}
.plan-card.pop{outline:2px solid var(--primary)}
.plan-price{font-size:34px;font-weight:800;font-family:'Space Grotesk';margin:10px 0}
.plan-price small{font-size:13px;color:var(--muted);font-weight:500}
.plan-feat{list-style:none;margin:16px 0;flex:1}
.plan-feat li{padding:7px 0;font-size:13.5px;color:var(--muted);display:flex;gap:9px;align-items:center}
.plan-feat li b{color:var(--text)}
.pop-badge{position:absolute;top:14px;right:-32px;background:linear-gradient(90deg,var(--primary),var(--accent));color:#fff;font-size:10px;font-weight:800;padding:5px 40px;transform:rotate(38deg);letter-spacing:1px}

/* ads */
.ad-preview{border-radius:12px;padding:18px;text-align:center;font-weight:700;font-size:14px;color:#fff;min-height:70px;display:flex;align-items:center;justify-content:center}
.ad-slot{border:1px dashed var(--border);border-radius:12px;padding:10px;text-align:center;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:8px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(5,8,20,.75);backdrop-filter:blur(6px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--panel2);border:1px solid var(--border);border-radius:20px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:28px;animation:popIn .25s}
.modal.wide{max-width:720px}
@keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.modal h3{font-size:19px;margin-bottom:18px}

/* toast */
.toasts{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--panel2);border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:12px;padding:14px 18px;font-size:13.5px;min-width:280px;box-shadow:0 12px 40px rgba(0,0,0,.5);animation:slideIn .3s}
.toast.ok{border-left-color:var(--ok)}
.toast.err{border-left-color:var(--danger)}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}

/* theme */
.theme-swatch{height:88px;border-radius:14px;cursor:pointer;border:2px solid transparent;position:relative;transition:.15s;display:flex;align-items:flex-end;padding:10px}
.theme-swatch.sel{border-color:#fff;transform:scale(1.03)}
.theme-swatch b{font-size:12px;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.color-dot{width:34px;height:34px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.color-dot.sel{border-color:#fff;transform:scale(1.15)}
input[type=color]{padding:3px;height:44px;cursor:pointer}

.perm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.perm-item{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:11px;padding:11px 13px;font-size:13px}
.perm-item input{width:auto}
.queue-status{font-size:11.5px;font-weight:700;padding:4px 12px;border-radius:20px}
.q-pending{background:rgba(253,203,110,.12);color:var(--warn)}
.q-pub{background:rgba(108,92,231,.15);color:var(--primary2)}
.q-ok{background:rgba(85,239,196,.12);color:var(--ok)}
.q-err{background:rgba(255,118,117,.12);color:var(--danger)}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:13.5px}
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin:26px 0 12px;font-weight:700}
.avatar-s{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff}
@media(max-width:1100px){.grid-4{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">🎧</div>
      <div><b>SesVizyon</b><small>sosyal otomasyon paneli</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="user-chip" onclick="switchUserModal()">
        <div class="av" id="ucAvatar">A</div>
        <div style="min-width:0"><b style="font-size:13.5px" id="ucName">Admin</b><small id="ucRole">Yönetici</small></div>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <button class="icon-btn" onclick="document.getElementById('sidebar').classList.toggle('collapsed')">☰</button>
      <div class="page-title" id="pageTitle">Gösterge Paneli</div>
      <div class="top-actions">
        <button class="icon-btn" id="themeToggle" onclick="toggleLight()" title="Tema değiştir">🌙</button>
        <div class="search-box">🔎 <input placeholder="Ara: video, içerik, kullanıcı..."></div>
        <button class="icon-btn" onclick="toast('3 yeni bildiriminiz var','ok')">🔔<span class="badge-dot"></span></button>
        <button class="btn btn-primary btn-sm" onclick="go('converter')">＋ Yeni Video</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBox"></div>
</div>
<div class="toasts" id="toasts"></div>

<script src="app.js?v=20260918-1"></script>
<script src="api-bridge.js?v=20260918-1"></script>
</body>
</html>
