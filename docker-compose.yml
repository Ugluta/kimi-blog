version: "3.9"

# SesVizyon — Faz 1 Geliştirme Ortamı (0-100K kullanıcı)
# Mimari: stateless API + asenkron iş hattı (Redis/BullMQ) + FFmpeg worker + S3 (MinIO)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-sesvizyon}
      POSTGRES_PASSWORD: ${DB_PASS:-devpass123}
      POSTGRES_DB: ${DB_NAME:-sesvizyon}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sesvizyon}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:                      # S3 uyumlu nesne depolama (karantina + üretim bucket'ları)
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET:-minioadmin123}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-init:                 # Bucket'ları ilk açılışta oluşturur
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 ${S3_ACCESS:-minioadmin} ${S3_SECRET:-minioadmin123};
      mc mb -p local/sesvizyon-media local/sesvizyon-quarantine || true;
      mc anonymous set download local/sesvizyon-media || true;
      exit 0;
      "

  api:                        # Stateless REST API (Faz 1'de tek servis = mini monolith)
    build: ./api
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    environment:
      DATABASE_URL: postgres://${DB_USER:-sesvizyon}:${DB_PASS:-devpass123}@postgres:5432/${DB_NAME:-sesvizyon}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS: ${S3_ACCESS:-minioadmin}
      S3_SECRET: ${S3_SECRET:-minioadmin123}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_degistir}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
    ports: ["3000:3000"]
    volumes: [uploads:/tmp/uploads]   # geçici upload alanı (karantina mantığı Faz 2'de S3'e taşınır)

  worker:                     # Asenkron render + sosyal yayın işçisi
    build: ./worker
    depends_on:
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    environment:
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS: ${S3_ACCESS:-minioadmin}
      S3_SECRET: ${S3_SECRET:-minioadmin123}
    deploy:
      replicas: 2             # tek komutla yatay ölçek: --scale worker=8
    volumes: [renders:/tmp/renders]

  web:                        # Yönetim paneli (nginx statik servis + API proxy)
    image: nginx:alpine
    depends_on: [api]
    ports: ["8080:80"]
    volumes:
      - ./web/panel:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  redisdata:
  miniodata:
  uploads:
  renders:
