global:
  scrape_interval: 15s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: containers
    static_configs:
      - targets: ['cadvisor:8080']
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:3000']   # Faz 3: prom-client eklenince dolacak
